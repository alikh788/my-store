<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجري الإلكتروني</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    header { text-align: center; padding: 20px; background: #1e293b; color: white; border-radius: 12px; margin-bottom: 20px; }
    .card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .card img { width: 100%; border-radius: 8px; height: auto; margin-bottom: 12px; }
    .card h3 { margin-top: 0; color: #0f172a; }
    .price { color: #16a34a; font-size: 1.25rem; font-weight: bold; margin-bottom: 10px; }
    .btn { display: block; width: 100%; padding: 10px; background-color: #2563eb; color: white; text-align: center; text-decoration: none; border-radius: 8px; font-weight: bold; box-sizing: border-box; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>متجري الإلكتروني</h1>
      <p>أفضل المنتجات الرقمية</p>
    </header>

    <div class="card">
      <img src="images/p1.jpg" alt="المنتج الأول">
      <h3>المنتج الأول</h3>
      <p>وصف المنتج الأول أو الخدمة الأولى.</p>
      <div class="price">$ 10.00</div>
      <a href="https://wa.me/963991400000" class="btn">طلب الآن عبر واتساب</a>
    </div>

    <div class="card">
      <img src="images/p2.jpg" alt="المنتج الثاني">
      <h3>المنتج الثاني</h3>
      <p>وصف المنتج الثاني أو الخدمة الثانية.</p>
      <div class="price">$ 20.00</div>
      <a href="https://wa.me/963991400000" class="btn">طلب الآن عبر واتساب</a>
    </div>
  </div>
</body>
</html>
